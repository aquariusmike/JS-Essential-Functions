<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { margin:0; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
    button { padding:10px 18px; font-size:16px; border:none; border-radius:8px; background:#3b82f6; color:#fff; cursor:pointer; }
    button.recording { background:#ef4444; }
    #status { margin-left:12px; font-size:13px; color:#666; }
  </style>
</head>
<body>
  <button id="recBtn">🎤 Start</button>
  <span id="status"></span>
  <script>
    const btn = document.getElementById('recBtn');
    const statusEl = document.getElementById('status');
    let recorder, stream, chunks = [];
    const send = (type, data) => window.parent.postMessage({ type, data }, '*');

    btn.addEventListener('click', async () => {
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        statusEl.textContent = 'Mic error: ' + err.name;
        send('mic-error', err.name);
        return;
      }
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.textContent = '🎤 Start';
        btn.classList.remove('recording');
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = () => { send('audio-ready', reader.result); statusEl.textContent = 'Sent'; };
        reader.readAsDataURL(blob);
      };
      recorder.start();
      btn.textContent = '⏹ Stop';
      btn.classList.add('recording');
      statusEl.textContent = 'Recording...';
    });
  </script>
</body>
</html>
