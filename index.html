<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; gap:12px; }
    button { padding:12px 22px; font-size:18px; border:none; border-radius:8px; background:#3b82f6; color:#fff; cursor:pointer; }
    button.recording { background:#ef4444; }
    #status { font-size:14px; color:#666; }
  </style>
</head>
<body>
  <button id="recBtn">🎤 Start</button>
  <div id="status"></div>
  <script>
    const btn = document.getElementById('recBtn');
    const statusEl = document.getElementById('status');
    let recorder, stream, chunks = [];

    btn.addEventListener('click', async () => {
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        statusEl.textContent = 'Mic error: ' + err.name;
        return;
      }
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const reader = new FileReader();
        reader.onloadend = () => {
          // Send back to the Wix page that opened this popup
          if (window.opener) {
            window.opener.postMessage({ type: 'audio-ready', data: reader.result }, '*');
            statusEl.textContent = 'Sent! Closing...';
            setTimeout(() => window.close(), 800);
          } else {
            statusEl.textContent = 'Lost connection to the page that opened this.';
          }
        };
        reader.readAsDataURL(blob);
      };
      recorder.start();
      btn.textContent = '⏹ Stop';
      btn.classList.add('recording');
      statusEl.textContent = 'Recording...';
    });
  </script>
</body>
</html>
